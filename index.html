  <script src="https://cdn.tailwindcss.com"></script>

  <script>

      theme: {
        extend: {

            brickDark: '#631924',

    }

      box-shadow: 0 4px 20px -2px rgba(139, 38, 53, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.06);
    }

      animation: pulseGlow 2.5s infinite;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F3EDE0;
    }
    ::-webkit-scrollbar-thumb {
      background: #C59B27;
      border-radius: 3px;

</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-brick selection:text-white">

  <!-- Toast Notification Container -->

  <!-- Top Navigation & Status Bar -->

        <div class="w-9 h-9 rounded-full bg-gold/20 border border-gold flex items-center justify-center text-goldLight shrink-0">
          <i class="fa-solid fa-compass text-lg"></i>
        </div>

          <p id="header-team-name" class="text-[11px] text-goldLight truncate max-w-[130px] sm:max-w-[200px]">點擊設定小隊名稱</p>
        </div>
      </div>

      <!-- Language Mode Toggle -->
      <div class="flex items-center bg-brickDark/90 p-1 rounded-lg border border-white/20 text-xs shrink-0">
        <button id="btn-lang-both" onclick="setLangMode('both')" class="px-2 py-1 rounded-md font-bold transition bg-gold text-ink">雙語</button>
        <button id="btn-lang-zh" onclick="setLangMode('zh')" class="px-2 py-1 rounded-md font-medium transition text-white/80 hover:text-white">繁中</button>
        <button id="btn-lang-ja" onclick="setLangMode('ja')" class="px-2 py-1 rounded-md font-medium transition text-white/80 hover:text-white">日本語</button>
      </div>
    </div>

    <div class="bg-brickDark/95 border-t border-white/10">
      <div class="max-w-2xl mx-auto px-3 py-1.5 flex items-center justify-between text-xs">
        <div class="flex items-center gap-3">
          <span class="flex items-center gap-1 text-goldLight font-bold">
            <i class="fa-solid fa-star"></i>
            <span id="header-score">0</span> pts
          </span>
          <span class="flex items-center gap-1 text-emerald-300 font-bold">
            <i class="fa-solid fa-gem"></i>
            <span id="header-shards">0/7</span> 碎片
          </span>
        </div>
        <button onclick="toggleTimer()" class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 px-2.5 py-0.5 rounded-full text-goldLight font-mono transition" title="點擊開始/暫停 90 分鐘倒數">
          <i id="timer-icon" class="fa-regular fa-clock"></i>
          <span id="timer-display">90:00</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Dynamic Content Container -->
  <main id="app-main" class="flex-1 max-w-2xl w-full mx-auto px-3 py-4 pb-24"></main>

  <!-- Bottom Fixed Navigation Bar -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-stone-300 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
    <div class="max-w-2xl mx-auto grid grid-cols-4 gap-1 px-2 py-1.5 text-xs">
      <button id="nav-hub" onclick="navigateTo('hub')" class="flex flex-col items-center justify-center py-1 rounded-lg text-brick font-bold">
        <i class="fa-solid fa-map-location-dot text-base mb-0.5"></i>

      </button>

        <span>教師攻略</span>

        </button>
      </div>

        </div>
        <div>
          <label class="block text-sm font-bold text-ink mb-1">上午輪替組別（總人數20人，各10人・1小時互換）</label>

            <option value="zoology">5. 動物博物館 (一號館)</option>

        </div>

    </div>

          <i class="fa-solid fa-lightbulb text-gold"></i>
          <span>線索提示 / ヒント</span>
        </h3>
        <button onclick="closeHintModal()" class="text-stone-400 hover:text-stone-700 text-xl">

        </button>

    // =========================================================================
    // 2. DIRECT FIRESTORE REST API SYNC (WORKS IN GITHUB PAGES & IFRAMES)
    // =========================================================================
    const FIREBASE_PROJECT_ID = "ntumuseum-41e54";
    const FIRESTORE_REST_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents`;
    const TEAMS_COLLECTION = "rpg_teams";
    const LOCAL_STORAGE_KEY = "ntu_museum_rpg_state_v3";

    let sessionDeviceId = 'dev_' + Math.random().toString(36).slice(2, 10);
    try {
      const storedId = localStorage.getItem('ntu_rpg_device_id');
      if (storedId) {
        sessionDeviceId = storedId;
      } else {
        localStorage.setItem('ntu_rpg_device_id', sessionDeviceId);
      }
    } catch (e) {
      // Fallback to in-memory device ID if storage is restricted
    }

    let cloudConnected = false;
    let cloudStatusText = '正在連線至雲端資料庫...';
    let cloudErrorMsg = '';
    let teacherPollInterval = null;

    const state = {
      langMode: 'both',
      teamName: '',
      morningGroup: 'A',
      startMuseum: 'history',
      timerSeconds: 90 * 60,
      timerRunning: false,
      currentView: 'hub',
      activeMuseumId: null,
      teacherAuthenticated: false,
      allTeamsBoard: [],
      progress: {}
    };

    MUSEUMS.forEach(m => {
      state.progress[m.id] = {
        solved: {},
        photoData: null,
        reflection: '',
        completed: false
      };
    });

    let timerInterval = null;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizeDocId(name) {
      return encodeURIComponent(name.trim()).replace(/%/g, '_').slice(0, 120) || sessionDeviceId;
    }

    function encodeFirestoreDoc(dataObj) {
      const completedValues = (dataObj.completedIds || []).map(id => ({ stringValue: String(id) }));
      const photoFields = {};
      if (dataObj.photos) {
        Object.entries(dataObj.photos).forEach(([k, v]) => {
          if (v) photoFields[k] = { stringValue: String(v) };
        });
      }
      return {
        fields: {
          teamName: { stringValue: String(dataObj.teamName || '') },
          morningGroup: { stringValue: String(dataObj.morningGroup || 'A') },
          startMuseum: { stringValue: String(dataObj.startMuseum || 'history') },
          score: { integerValue: String(dataObj.score || 0) },
          shards: { integerValue: String(dataObj.shards || 0) },
          completedIds: { arrayValue: { values: completedValues } },
          photos: { mapValue: { fields: photoFields } },
          anatomyReflection: { stringValue: String(dataObj.anatomyReflection || '') },
          updatedAt: { stringValue: String(dataObj.updatedAt || '') }
        }
      };
    }

    function decodeFirestoreDoc(docObj) {
      const f = docObj.fields || {};
      const completedIds = (f.completedIds && f.completedIds.arrayValue && f.completedIds.arrayValue.values)
        ? f.completedIds.arrayValue.values.map(v => v.stringValue || '')
        : [];
      const photos = {};
      if (f.photos && f.photos.mapValue && f.photos.mapValue.fields) {
        Object.entries(f.photos.mapValue.fields).forEach(([k, v]) => {
          if (v && v.stringValue) photos[k] = v.stringValue;
        });
      }
      return {
        teamName: (f.teamName && f.teamName.stringValue) || '未命名小隊',
        morningGroup: (f.morningGroup && f.morningGroup.stringValue) || 'A',
        startMuseum: (f.startMuseum && f.startMuseum.stringValue) || 'history',
        score: Number((f.score && f.score.integerValue) || 0),
        shards: Number((f.shards && f.shards.integerValue) || 0),
        completedIds,
        photos,
        anatomyReflection: (f.anatomyReflection && f.anatomyReflection.stringValue) || '',
        updatedAt: (f.updatedAt && f.updatedAt.stringValue) || ''
      };
    }

    // =========================================================================
    // 3. STATE PERSISTENCE & CLOUD SYNC FUNCTIONS
    // =========================================================================
    function calculateStats() {
      let score = 0;
      let shards = 0;
      MUSEUMS.forEach(m => {
        const p = state.progress[m.id];
        const solvedCount = Object.keys(p.solved).length;
        score += solvedCount * 2;
        if (p.photoData) score += 3;
        p.completed = (solvedCount === m.questions.length && Boolean(p.photoData));
        if (p.completed) shards += 1;
      });
      return { score, shards };
    }

    function updateHeaderStats() {
      const stats = calculateStats();
      const scoreEl = document.getElementById('header-score');
      const shardsEl = document.getElementById('header-shards');
      const teamEl = document.getElementById('header-team-name');
      if (scoreEl) scoreEl.textContent = stats.score;
      if (shardsEl) shardsEl.textContent = `${stats.shards}/${MUSEUMS.length}`;
      if (teamEl) {
        teamEl.textContent = state.teamName.trim()
          ? `${state.teamName} (${state.morningGroup}組)`
          : '點擊設定小隊名稱';
      }
    }

    async function saveAndSyncState() {
      // 1. Save backup to localStorage
      try {
        const backupPayload = {
          langMode: state.langMode,
          teamName: state.teamName,
          morningGroup: state.morningGroup,
          startMuseum: state.startMuseum,
          timerSeconds: state.timerSeconds,
          progress: state.progress
        };
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(backupPayload));
      } catch (e) {
        // Ignore storage quota or sandbox errors
      }

      // 2. Sync to Firestore REST API
      const stats = calculateStats();
      const anatomyReflectionText = (state.progress.anatomy && state.progress.anatomy.reflection)
        ? state.progress.anatomy.reflection.trim()
        : '';
      const hasNamedTeam = Boolean(state.teamName.trim());
      if (!hasNamedTeam && stats.score === 0 && !anatomyReflectionText) return;

      const photos = {};
      MUSEUMS.forEach(m => {
        if (state.progress[m.id].photoData) {
          photos[m.id] = state.progress[m.id].photoData;
        }
      });

      const docId = hasNamedTeam ? sanitizeDocId(state.teamName) : `temp_${sessionDeviceId}`;
      const displayTeamName = hasNamedTeam ? state.teamName.trim() : `未命名小隊-${sessionDeviceId.slice(-4)}`;

      const payload = encodeFirestoreDoc({
        teamName: displayTeamName,
        morningGroup: state.morningGroup,
        startMuseum: state.startMuseum,
        score: stats.score,
        shards: stats.shards,
        completedIds: MUSEUMS.filter(m => state.progress[m.id].completed).map(m => m.id),
        photos,
        anatomyReflection: anatomyReflectionText,
        updatedAt: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      });

      try {
        const res = await fetch(`${FIRESTORE_REST_BASE}/${TEAMS_COLLECTION}/${docId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const errJson = await res.json().catch(() => ({}));
          cloudConnected = false;
          cloudErrorMsg = (errJson.error && errJson.error.message) || `HTTP ${res.status}`;
        } else {
          cloudConnected = true;
          cloudErrorMsg = '';
        }
      } catch (err) {
        cloudConnected = false;
        cloudErrorMsg = err.message || '網路連線中斷';
      }
    }

    function restoreLocalBackupIfAvailable() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.langMode) state.langMode = parsed.langMode;
        if (parsed.teamName) state.teamName = parsed.teamName;
        if (parsed.morningGroup) state.morningGroup = parsed.morningGroup;
        if (parsed.startMuseum) state.startMuseum = parsed.startMuseum;
        if (typeof parsed.timerSeconds === 'number' && parsed.timerSeconds > 0) {
          state.timerSeconds = parsed.timerSeconds;
        }
        if (parsed.progress) {
          MUSEUMS.forEach(m => {
            if (parsed.progress[m.id]) {
              state.progress[m.id] = {
                solved: parsed.progress[m.id].solved || {},
                photoData: parsed.progress[m.id].photoData || null,
                reflection: parsed.progress[m.id].reflection || '',
                completed: Boolean(parsed.progress[m.id].completed)
              };
            }
          });
        }
        applyLangButtonUI();
        updateTimerDisplay();
      } catch (e) {
        // Ignore parse errors
      }
    }

    async function fetchAllTeamsFromCloud(manual = false) {
      try {
        const res = await fetch(`${FIRESTORE_REST_BASE}/${TEAMS_COLLECTION}?pageSize=100`, {
          method: 'GET',
          cache: 'no-store'
        });
        const data = await res.json();
        if (!res.ok) {
          cloudConnected = false;
          cloudErrorMsg = (data.error && data.error.message) || `HTTP ${res.status}`;
          cloudStatusText = '雲端連線異常';
          if (state.currentView === 'teacher') render();
          return;
        }

        cloudConnected = true;
        cloudErrorMsg = '';
        const docs = data.documents || [];
        state.allTeamsBoard = docs.map(decodeFirestoreDoc);
        cloudStatusText = `雲端已直連（目前共 ${state.allTeamsBoard.length} 組資料）`;

        if (manual) {
          showToast(`已刷新！共讀取 ${state.allTeamsBoard.length} 組進度`, 'クラウドデータを更新しました！', 'success');
        }
        if (state.currentView === 'teacher') render();
      } catch (err) {
        cloudConnected = false;
        cloudErrorMsg = err.message || '無法連線至伺服器';
        cloudStatusText = '雲端連線異常';
        if (state.currentView === 'teacher') render();
      }
    }

    // =========================================================================
    // 4. UI HELPERS, AUDIO FEEDBACK & TIMER
    // =========================================================================
    function playChime(success = true) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (success) {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.09);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start();
          osc.stop(ctx.currentTime + 0.45);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {
        // Ignore audio restrictions
      }
    }

    function showToast(zh, ja, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const bgMap = {
        success: 'bg-forest text-white border-emerald-400',
        error: 'bg-rose-900 text-white border-rose-400',
        info: 'bg-ink text-white border-gold'
      };
      el.className = `${bgMap[type] || bgMap.info} border-l-4 px-4 py-2.5 rounded-xl shadow-xl text-xs sm:text-sm font-medium transition-all duration-300 transform translate-y-0 opacity-100`;
      el.innerHTML = `
        <div class="font-bold">${zh}</div>
        ${ja ? `<div class="text-[11px] opacity-90 mt-0.5">${ja}</div>` : ''}
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2800);
    }

    function biText(zh, ja, tag = 'div', zhClass = '', jaClass = 'text-xs text-stone-600 mt-0.5') {
      if (state.langMode === 'zh') {
        return `<${tag} class="${zhClass}">${zh}</${tag}>`;
      }
      if (state.langMode === 'ja') {
        return `<${tag} class="${zhClass}">${ja}</${tag}>`;
      }
      return `
        <${tag} class="${zhClass}">${zh}</${tag}>
        <${tag} class="${jaClass}">${ja}</${tag}>
      `;
    }

    function applyLangButtonUI() {
      ['both', 'zh', 'ja'].forEach(m => {
        const btn = document.getElementById(`btn-lang-${m}`);
        if (!btn) return;
        if (state.langMode === m) {
          btn.className = 'px-2 py-1 rounded-md font-bold transition bg-gold text-ink';
        } else {
          btn.className = 'px-2 py-1 rounded-md font-medium transition text-white/80 hover:text-white';
        }
      });
    }

    function setLangMode(mode) {
      state.langMode = mode;
      applyLangButtonUI();
      saveAndSyncState();
      render();
    }

    function updateTimerDisplay() {
      const disp = document.getElementById('timer-display');
      const icon = document.getElementById('timer-icon');
      if (!disp) return;
      const mins = Math.floor(state.timerSeconds / 60);
      const secs = state.timerSeconds % 60;
      disp.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      if (icon) {
        icon.className = state.timerRunning
          ? 'fa-solid fa-stopwatch text-emerald-300 animate-pulse'
          : 'fa-regular fa-clock';
      }
    }

    function startTimer() {
      if (state.timerRunning) return;
      state.timerRunning = true;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if (state.timerSeconds > 0) {
          state.timerSeconds -= 1;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          state.timerRunning = false;
          updateTimerDisplay();
          showToast('90 分鐘倒數結束！請準備返回集合點', '90分の制限時間が終了しました！集合場所へ戻りましょう', 'info');
        }
      }, 1000);
    }

    function toggleTimer() {
      if (state.timerRunning) {
        clearInterval(timerInterval);
        state.timerRunning = false;
        updateTimerDisplay();
        showToast('倒數計時已暫停', 'タイマーを一時停止しました', 'info');
      } else {
        startTimer();
        showToast('90 分鐘探索倒數開始！', '90分カウントダウン開始！', 'success');
      }
    }

      ['hub', 'bag', 'certificate', 'teacher'].forEach(nav => {

        const activeNav = (view === 'museum' && nav === 'hub') || (view === nav);

    function normalizeAnswer(str) {

        .trim()
        .toLowerCase()
        .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/\s+/g, '');
    }

    function checkAnswer(museumId, qId) {
      const m = MUSEUMS.find(x => x.id === museumId);
      if (!m) return;
      const q = m.questions.find(x => x.id === qId);
      if (!q) return;

      let userVal = '';
      if (q.type === 'text') {
        const input = document.getElementById(`input-${qId}`);
        userVal = input ? input.value : '';
      } else {
        const selected = document.querySelector(`input[name="radio-${qId}"]:checked`);
        userVal = selected ? selected.value : '';
      }

      if (!userVal.trim()) {
        showToast('請先輸入或選擇答案！', '答えを入力または選択してください！', 'error');
        return;
      }

      const normUser = normalizeAnswer(userVal);
      const isCorrect = q.answers.some(ans => normalizeAnswer(ans) === normUser);

      if (isCorrect) {
        state.progress[museumId].solved[qId] = true;
        playChime(true);
        saveAndSyncState();
        updateHeaderStats();
        render();
        showToast('答對了！獲得 +2 積分！', '正解です！+2ポイント獲得！', 'success');
      } else {
        playChime(false);
        showToast('答案不正確，再觀察展品或點擊「提示」吧！', '不正解です。展示品をもう一度観察するか「ヒント」を見てみましょう！', 'error');
      }
    }

    function handlePhotoUpload(event, museumId) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 720;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
          state.progress[museumId].photoData = compressedDataUrl;
          playChime(true);
          saveAndSyncState();
          updateHeaderStats();
          render();
          showToast('打卡合照上傳成功！已同步至教師戰情室', '記念写真をアップロードしました！', 'success');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

              const p = state.progress[m.id];
              return `
                <div onclick="navigateTo('museum', '${m.id}')" class="rounded-2xl p-4 border-2 cursor-pointer transition ${p.completed ? 'bg-white border-gold archival-shadow' : 'bg-stone-100/80 border-stone-200 opacity-75'}">
                  <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl ${p.completed ? m.color + ' text-white' : 'bg-stone-300 text-stone-500'} flex items-center justify-center text-xl shrink-0">
                      <i class="fa-solid ${p.completed ? m.icon : 'fa-lock'}"></i>
                    </div>
                    <div>
                      <div class="text-xs font-bold text-stone-500">${m.titleZh.replace('國立臺灣大學', '').replace('臺大醫學院', '').replace('臺大', '')}</div>
                      <div class="font-black text-sm ${p.completed ? 'text-ink' : 'text-stone-400'}">
                        ${p.completed ? `${m.shardNameZh} / ${m.shardNameJa}` : '尚未解鎖碎片'}
                      </div>
                      <div class="text-[11px] font-mono mt-0.5 ${p.completed ? 'text-brick font-bold' : 'text-stone-400'}">
                        ${p.completed ? `密語：${m.code}` : '完成 4 題 + 合照解鎖'}
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderCertificateView() {
      const stats = calculateStats();
      const photos = MUSEUMS.filter(m => state.progress[m.id].photoData);

      return `
        <div class="space-y-4">
          <div class="bg-parchment border-4 border-double border-gold rounded-3xl p-5 sm:p-6 archival-shadow text-center space-y-4 relative overflow-hidden">
            <div class="text-xs font-bold tracking-[0.25em] text-brick uppercase">NATIONAL TAIWAN UNIVERSITY MUSEUMS</div>
            <div>
              <h2 class="text-xl sm:text-2xl font-black text-ink">台日青年文化交流・實境探索證書</h2>
              <p class="text-xs text-stone-600 mt-0.5">日台青年文化交流・台湾大学博物館群リアル探索認定証</p>
            </div>

            <div class="py-3 px-4 rounded-2xl bg-white/90 border border-gold/60 inline-block min-w-[240px]">
              <div class="text-[11px] text-stone-500">探索小隊 / チーム名</div>
              <div class="text-lg sm:text-xl font-black text-brick mt-0.5">${state.teamName ? escapeHtml(state.teamName) : '尚未設定小隊名稱'}</div>
            </div>

            <div class="grid grid-cols-2 gap-3 max-w-sm mx-auto">
              <div class="bg-white rounded-2xl p-3 border border-stone-200">
                <div class="text-xs text-stone-500">總積分 / 合計スコア</div>
                <div class="text-2xl font-black text-brick">${stats.score} <span class="text-xs font-normal">/ 77</span></div>
              </div>
              <div class="bg-white rounded-2xl p-3 border border-stone-200">
                <div class="text-xs text-stone-500">時空碎片 / 獲得欠片</div>
                <div class="text-2xl font-black text-forest">${stats.shards} <span class="text-xs font-normal">/ 7</span></div>
              </div>
            </div>

            ${photos.length > 0 ? `
              <div class="pt-2 text-left">
                <div class="text-xs font-bold text-stone-600 mb-2 text-center">📸 小隊探索足跡合照集（點擊放大）</div>
                <div class="grid grid-cols-3 gap-2">
                  ${photos.map(m => `
                    <img src="${state.progress[m.id].photoData}" onclick="openPhotoZoom('${state.progress[m.id].photoData}', '${m.titleZh}')" class="w-full h-20 object-cover rounded-xl border border-stone-300 cursor-pointer" />
                  `).join('')}
                </div>
              </div>
            ` : `
              <p class="text-xs text-stone-500">完成各館拍照打卡後，合照將自動彙整於此證書中！</p>
            `}

            <div class="pt-2 text-[11px] text-stone-500">
              國立臺灣大學博物館群跨文化實境探索計畫
            </div>
          </div>
        </div>
      `;
    }

    function renderTeacherView() {
      if (!state.teacherAuthenticated) {
        return `
          <div class="max-w-md mx-auto mt-6 bg-white rounded-2xl p-6 archival-shadow border-2 border-gold text-center space-y-4">
            <div class="w-14 h-14 rounded-full bg-brick/10 text-brick flex items-center justify-center text-2xl mx-auto">
              <i class="fa-solid fa-lock"></i>
            </div>
            <div>
              <h2 class="text-lg font-black text-ink">教師攻略與即時戰情室</h2>
              <p class="text-xs text-stone-500 mt-1">此區包含各館標準答案與所有小隊即時積分後台，請輸入教師密碼解鎖。</p>
            </div>
            <div class="space-y-3">
              <input
                type="password"
                id="teacher-pass-input"
                inputmode="numeric"
                onkeydown="if(event.key==='Enter') unlockTeacher()"
                placeholder="請輸入教師密碼"
                class="w-full px-4 py-3 rounded-xl border border-stone-300 text-center text-lg tracking-widest focus:outline-none focus:border-brick"
              />
              <button onclick="unlockTeacher()" class="w-full py-3 rounded-xl bg-brick hover:bg-brickDark text-white font-bold shadow transition">
                解鎖進入 / ロック解除
              </button>
            </div>
          </div>
        `;
      }

      // Merge cloud teams with current device's local team if ahead
      const stats = calculateStats();
      const map = new Map();
      state.allTeamsBoard.forEach(t => {
        if (t && t.teamName) map.set(t.teamName, t);
      });

      if (state.teamName.trim()) {
        const photos = {};
        MUSEUMS.forEach(m => {
          if (state.progress[m.id].photoData) photos[m.id] = state.progress[m.id].photoData;
        });
        const localEntry = {
          teamName: state.teamName.trim(),
          morningGroup: state.morningGroup,
          score: stats.score,
          shards: stats.shards,
          completedIds: MUSEUMS.filter(m => state.progress[m.id].completed).map(m => m.id),
          photos: photos,
          anatomyReflection: (state.progress.anatomy && state.progress.anatomy.reflection) || '',
          updatedAt: '本機最新'
        };
        if (!map.has(localEntry.teamName) || (map.get(localEntry.teamName).score || 0) <= localEntry.score) {
          map.set(localEntry.teamName, localEntry);
        }
      }

      const sortedTeams = Array.from(map.values()).sort((a, b) => (b.score || 0) - (a.score || 0));

      return `
        <div class="space-y-4">
          <!-- War Room Header -->
          <div class="bg-ink text-white rounded-2xl p-4 archival-shadow flex items-center justify-between gap-2">
            <div>
              <h2 class="font-black text-base text-goldLight flex items-center gap-2">
                <i class="fa-solid fa-satellite-dish"></i>
                <span>教師即時戰情室與標準答案</span>
              </h2>
              <div class="text-xs mt-1 ${cloudConnected ? 'text-emerald-300' : 'text-rose-300'}">
                <i class="fa-solid ${cloudConnected ? 'fa-circle-check' : 'fa-triangle-exclamation'} mr-1"></i>${cloudStatusText}
              </div>
              ${cloudErrorMsg ? `<div class="text-[11px] text-rose-300 mt-0.5">連線受阻：${escapeHtml(cloudErrorMsg)}</div>` : ''}
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="fetchAllTeamsFromCloud(true)" class="px-2.5 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold">
                <i class="fa-solid fa-rotate mr-1"></i>刷新
              </button>
              <button onclick="lockTeacher()" class="px-2.5 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-white text-xs font-bold">
                <i class="fa-solid fa-lock mr-1"></i>上鎖
              </button>
            </div>
          </div>

          <!-- Live Leaderboard -->
          <div class="bg-white rounded-2xl p-4 archival-shadow border border-stone-200 space-y-3">
            <h3 class="font-black text-sm text-brick flex items-center justify-between">
              <span><i class="fa-solid fa-ranking-star mr-1"></i>各小隊雲端即時進度排行榜</span>
              <span class="text-xs font-normal text-stone-500">每 8 秒自動同步</span>
            </h3>

            ${sortedTeams.length > 0 ? `
              <div class="space-y-2.5">
                ${sortedTeams.map((t, idx) => `
                  <div class="p-3 rounded-xl bg-parchment/70 border border-stone-200 space-y-2">
                    <div class="flex items-center justify-between">
                      <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full ${idx === 0 ? 'bg-gold text-ink' : 'bg-stone-700 text-white'} text-xs font-black flex items-center justify-center">${idx + 1}</span>
                        <span class="font-black text-sm text-ink">${escapeHtml(t.teamName)}</span>
                        <span class="text-[11px] px-1.5 py-0.5 rounded bg-stone-200 text-stone-700 font-bold">${escapeHtml(t.morningGroup || 'A')}組</span>
                      </div>
                      <div class="text-right">
                        <span class="font-black text-brick text-sm">${t.score || 0} pts</span>
                        <span class="text-xs text-forest font-bold ml-1.5">(${t.shards || 0}/7館)</span>
                      </div>
                    </div>

                    <div class="flex flex-wrap gap-1">
                      ${MUSEUMS.map(m => {
                        const done = (t.completedIds || []).includes(m.id);
                        return `<span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${done ? 'bg-emerald-600 text-white' : 'bg-stone-200 text-stone-500'}">${m.titleZh.replace('國立臺灣大學', '').replace('臺大醫學院', '').replace('臺大', '').slice(0, 3)}</span>`;
                      }).join('')}
                    </div>

                    ${t.photos && Object.keys(t.photos).length > 0 ? `
                      <div class="flex gap-1.5 overflow-x-auto pt-1">
                        ${Object.entries(t.photos).map(([mId, src]) => {
                          const mObj = MUSEUMS.find(x => x.id === mId);
                          return `<img src="${src}" onclick="openPhotoZoom('${src}', '${escapeHtml(t.teamName)} - ${mObj ? mObj.titleZh : ''}')" class="w-14 h-14 rounded-lg object-cover border border-stone-300 cursor-pointer shrink-0" />`;
                        }).join('')}
                      </div>
                    ` : ''}

                    ${t.anatomyReflection ? `
                      <div class="p-2.5 rounded-lg bg-pink-50/90 border border-pink-200 text-xs text-ink leading-relaxed">
                        <div class="font-bold text-pink-800 mb-0.5"><i class="fa-solid fa-comment-dots mr-1"></i>解剖館心得與感想：</div>
                        <div class="whitespace-pre-wrap text-stone-700">${escapeHtml(t.anatomyReflection)}</div>
                      </div>
                    ` : ''}

                    ${t.updatedAt ? `<div class="text-[10px] text-stone-400 text-right">最後更新：${escapeHtml(t.updatedAt)}</div>` : ''}
                  </div>
                `).join('')}
              </div>
            ` : `
              <div class="text-xs text-stone-500 bg-parchment/60 p-3 rounded-xl text-center">
                目前雲端尚無小隊紀錄。請各組在首頁設定「小隊名稱」並開始作答，進度與合照即會自動同步顯示於此。
              </div>
            `}
          </div>

          <!-- Schedule Reminder -->
          <div class="bg-white rounded-2xl p-4 archival-shadow border border-stone-200 text-xs space-y-2">
            <h3 class="font-bold text-sm text-brick"><i class="fa-regular fa-calendar-check mr-1"></i>一日行程（20人編制）與開館時間提醒</h3>
            <ul class="list-disc pl-4 space-y-1 text-stone-700 leading-relaxed">
              <li><strong>09:30–11:30 上午場（20人分兩組各10人・各1小時互換）</strong>：
                <br>• <strong>A組（10人）</strong>：09:30–10:30 醫學人文博物館 → 10:30–11:30 解剖學教育展示館
                <br>• <strong>B組（10人）</strong>：09:30–10:30 解剖學教育展示館 → 10:30–11:30 醫學人文博物館
                <br>• <em>禮儀提醒：解剖學教育展示館內部嚴禁攝影，第 5 題合照務必帶至館外看板處拍攝。</em>
              </li>
              <li><strong>11:30–13:20 午餐移動</strong>：捷運台大醫院站 → 公館站，建議於公館商圈或校內鹿鳴廣場用餐。</li>
              <li><strong>13:20–14:50 下午大地遊戲（建議分為 4–5 小隊，每隊 4–5 人）</strong>：物理文物廳 <strong>13:30 開館</strong>、植物標本館 <strong>13:00 開館</strong>。請避開週一、週二參訪以確保全館開放。</li>
              <li><strong>計分規則</strong>：每館 4 題解謎（每題 2 分）＋ 1 題拍照任務（3 分）＝ 單館 11 分，七館總計 77 分。</li>
            </ul>
          </div>

          <!-- External Web Resources -->
          <div class="bg-white rounded-2xl p-4 archival-shadow border border-stone-200 text-xs space-y-2">
            <h3 class="font-bold text-sm text-brick"><i class="fa-solid fa-globe mr-1"></i>場館官方網頁資源 / 公式Webリソース</h3>
            <div class="flex flex-col gap-2">
              <a href="https://www.mc.ntu.edu.tw/anatomy/Fpage.action?muid=4149&fid=3201" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-2.5 rounded-xl bg-parchment hover:bg-goldLight/40 border border-stone-300 text-ink font-bold transition">
                <span><i class="fa-solid fa-heart-pulse text-pink-800 mr-1.5"></i>國立臺灣大學醫學院 解剖學教育展示館（官方介紹與預約資訊）</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-stone-500"></i>
              </a>
            </div>
          </div>

          <!-- All Answers Cheat Sheet -->
          <div class="space-y-3">
            ${MUSEUMS.map(m => `
              <div class="bg-white rounded-2xl p-4 archival-shadow border border-stone-200">
                <div class="flex items-center justify-between border-b border-stone-200 pb-2 mb-2.5">
                  <h4 class="font-black text-ink text-sm">${m.titleZh}（密語：${m.code}）</h4>
                  <span class="text-[11px] text-stone-500">${m.hoursZh}</span>
                </div>
                <ol class="space-y-2 text-xs text-stone-700">
                  ${m.questions.map((q, i) => `
                    <li class="bg-parchment/70 p-2 rounded-lg">
                      <div class="font-bold text-ink">Q${i+1}. ${q.promptZh}</div>
                      <div class="text-forest font-bold mt-0.5">
                        ✓ 接受關鍵字：${q.answers.slice(0, 5).join(' / ')}
                      </div>
                    </li>
                  `).join('')}
                  <li class="bg-amber-50 p-2 rounded-lg border border-amber-200">
                    <div class="font-bold text-amber-900">Q5. 拍照任務：${m.photoTask.titleZh}</div>
                  </li>
                </ol>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Initialize Application
    window.addEventListener('DOMContentLoaded', () => {
      restoreLocalBackupIfAvailable();
      updateHeaderStats();
      render();
      fetchAllTeamsFromCloud(false);
    });
  </script>
</body>
</html>
